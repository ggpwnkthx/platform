# The production stack of the platform: the three services and the
# infrastructure they share.
#
#   docker compose -f deploy/compose/production/platform.compose.yaml up -d
#
# The three services are deployed apart as well: the stacks of the
# gateway, of the access service and of the data service are in this
# directory, and they hold the same services, the same ports and the same
# variables of the environment as this composition.
#
# The secrets come from the environment of the shell (a secret store, a
# vault agent, the secrets of the orchestrator). The file below holds no
# credential: the values that are not set make the services refuse to
# start, exactly like in a production deployment.
#
# The files of the credentials of the data service are named by the
# environment:
#
#   ACCESS_CONTEXT_TOKEN_FILE=/etc/platform/secrets/access-context.token \
#   CURSOR_KEY_FILE=/etc/platform/secrets/cursor.key \
#   GATEWAY_IDENTITY_PUBLIC_KEY=/etc/platform/secrets/identity-signing.public.pem \
#   docker compose -f deploy/compose/production/platform.compose.yaml up -d
name: platform

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?the password of the server is required}
      POSTGRES_DB: platform
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U platform']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pg-data:/var/lib/postgresql/data

  # The role of the access service. The service refuses to start with a
  # role that bypasses the isolation of the tenants, and the role of the
  # administrator of the server is such a role.
  roles:
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?the password of the server is required}
    command:
      - sh
      - -c
      - |
        psql "postgres://platform:${POSTGRES_PASSWORD:?the password of the server is required}@postgres:5432/platform" -v ON_ERROR_STOP=1 <<'SQL'
        create role access_app login password '${ACCESS_APP_PASSWORD:?the password of the role of the access service is required}';
        grant usage, create on schema public to access_app;
        SQL

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - '60'
      - '1'
      - --maxmemory-policy
      - volatile-ttl
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # The access service: the OpenID Connect broker and the access
  # decision service.
  access:
    image: ghcr.io/ggpwnkthx/access:1.0.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      roles:
        condition: service_completed_successfully
    ports:
      - '8081:8081'
    environment:
      ACCESS_ENVIRONMENT: production
      ACCESS_HOST: 0.0.0.0
      ACCESS_PORT: '8081'
      ACCESS_ISSUER: ${ACCESS_ISSUER:?the issuer of the service is required}
      ACCESS_DATABASE_URL: postgres://access_app:${ACCESS_APP_PASSWORD:?the password of the role of the access service is required}@postgres:5432/platform
      ACCESS_REDIS_URL: redis://redis:6379/0
      ACCESS_ADMIN_TOKEN: ${ACCESS_ADMIN_TOKEN:?the token of the administration is required}
      ACCESS_DECISION_TOKEN: ${ACCESS_DECISION_TOKEN:?the token of the decisions is required}
      ACCESS_CONTEXT_TOKENS: ${ACCESS_CONTEXT_TOKENS:?the credentials of the context contract are required}
      ACCESS_STATE_SECRET: ${ACCESS_STATE_SECRET:?the secret of the state of a login is required}
      ACCESS_SECRET_ENCRYPTION_KEY: ${ACCESS_SECRET_ENCRYPTION_KEY:?the key of the secrets at rest is required}
      ACCESS_SIGNING_KEY: ${ACCESS_SIGNING_KEY:?the key of the signature of the tokens is required}
      ACCESS_SIGNING_KID: ${ACCESS_SIGNING_KID:?the identifier of the key is required}
      ACCESS_METRICS_TOKEN: ${ACCESS_METRICS_TOKEN:-}
      ACCESS_LOG_LEVEL: ${ACCESS_LOG_LEVEL:-info}
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:8081/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s

  # The roles of the data service and the schema of its deployment. The
  # service waits for them: it refuses to start against a database that
  # is not migrated.
  data-migrate:
    image: ghcr.io/ggpwnkthx/data:1.0.0
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    command: ['sh', '-c', 'bun run scripts/cli/provision.ts && bun run scripts/cli/migrate.ts']
    environment:
      DATA_ADMIN_DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD:?the password of the server is required}@postgres:5432/postgres
      DATA_OWNER_DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD:?the password of the server is required}@postgres:5432/data
      DATA_OWNER_PASSWORD: ${DATA_OWNER_PASSWORD:?the password of the owner of the schema is required}
      DATA_RUNTIME_PASSWORD: ${DATA_RUNTIME_PASSWORD:?the password of the role of the api is required}
      DATA_REGISTRY_PASSWORD: ${DATA_REGISTRY_PASSWORD:?the password of the registry reader is required}
      DATA_DELIVERY_PASSWORD: ${DATA_DELIVERY_PASSWORD:?the password of the role of the deliveries is required}
      DATA_MAINTENANCE_PASSWORD: ${DATA_MAINTENANCE_PASSWORD:?the password of the role of the retention is required}

  # The data service: the headless, permission aware data api.
  data:
    image: ghcr.io/ggpwnkthx/data:1.0.0
    restart: unless-stopped
    depends_on:
      data-migrate:
        condition: service_completed_successfully
    ports:
      - '8082:8082'
    environment:
      DATA_ENVIRONMENT: production
      DATA_HOST: 0.0.0.0
      DATA_PORT: '8082'
      DATA_PROCESS_ROLE: api
      DATA_DATABASE_URL: postgres://data_runtime:${DATA_RUNTIME_PASSWORD:?the password of the role of the api is required}@postgres:5432/data
      DATA_REGISTRY_DATABASE_URL: postgres://data_registry:${DATA_REGISTRY_PASSWORD:?the password of the registry reader is required}@postgres:5432/data
      DATA_SCHEMA_BUNDLE_FILE: /app/packages/data/manifests/schema.json
      DATA_POLICY_BUNDLE_FILE: /app/packages/data/manifests/policies.json
      DATA_GATEWAY_BINDINGS_FILE: /etc/platform/bindings.json
      DATA_ACCESS_URL: ${DATA_ACCESS_URL:?the access service of the access context contract is required}
      DATA_ACCESS_CONTEXT_TOKEN_FILE: /run/secrets/access-context.token
      DATA_CURSOR_KEY_FILE: /run/secrets/cursor.key
      DATA_LOG_LEVEL: ${DATA_LOG_LEVEL:-info}
    volumes:
      - ../../config/bindings.json:/etc/platform/bindings.json:ro
    secrets:
      - source: access-context-token
        target: access-context.token
      - source: cursor-key
        target: cursor.key
      - source: gateway-identity-public-key
        target: identity-signing.public.pem
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:8082/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s

  # The gateway: the only service the callers reach.
  gateway:
    image: ghcr.io/ggpwnkthx/gateway:1.0.0
    restart: unless-stopped
    depends_on:
      access:
        condition: service_started
      data:
        condition: service_started
    ports:
      - '8080:8080'
    environment:
      GATEWAY_CONFIG: /etc/platform/routes.json
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: '8080'
      GATEWAY_OIDC_ISSUER: ${GATEWAY_OIDC_ISSUER:?the issuer of the identity provider is required}
      GATEWAY_OIDC_CLIENT_ID: ${GATEWAY_OIDC_CLIENT_ID:-platform}
      GATEWAY_OIDC_CLIENT_SECRET: ${GATEWAY_OIDC_CLIENT_SECRET:?the secret of the client is required}
      GATEWAY_OIDC_REDIRECT_URI: ${GATEWAY_OIDC_REDIRECT_URI:?the url of the callback is required}
      GATEWAY_ACCESS_URL: ${GATEWAY_ACCESS_URL:-http://access:8081}
      GATEWAY_ACCESS_TOKEN: ${GATEWAY_ACCESS_TOKEN:?the token of the access service is required}
      GATEWAY_SESSION_SECRET: ${GATEWAY_SESSION_SECRET:?the secret of the sessions is required}
      GATEWAY_IDENTITY_SIGNING_KEY: ${GATEWAY_IDENTITY_SIGNING_KEY:?the key of the identity signature is required}
      GATEWAY_SESSION_URL: redis://redis:6379/0
      GATEWAY_SHARED_STATE_URL: redis://redis:6379/1
      GATEWAY_METRICS_TOKEN: ${GATEWAY_METRICS_TOKEN:?the token of the metrics is required}
      GATEWAY_RATE_LIMIT_TOTAL_MAX: ${GATEWAY_RATE_LIMIT_TOTAL_MAX:-1000}
      GATEWAY_RATE_LIMIT_GLOBAL_MAX: ${GATEWAY_RATE_LIMIT_GLOBAL_MAX:-600}
      GATEWAY_RATE_LIMIT_MAX: ${GATEWAY_RATE_LIMIT_MAX:-600}
      GATEWAY_RATE_LIMIT_PRINCIPAL_MAX: ${GATEWAY_RATE_LIMIT_PRINCIPAL_MAX:-300}
      GATEWAY_EXTERNAL_PROTO: ${GATEWAY_EXTERNAL_PROTO:-https}
      GATEWAY_COOKIE_SECURE: ${GATEWAY_COOKIE_SECURE:-true}
      GATEWAY_TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
      GATEWAY_TRUSTED_PROXY_HOPS: ${GATEWAY_TRUSTED_PROXY_HOPS:-1}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
      GATEWAY_SHUTDOWN_TIMEOUT_MS: '15000'
    volumes:
      - ../../config/routes.json:/etc/platform/routes.json:ro
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s

  # The control plane is the administrative surface of the deployment. It is
  # internal: the port is not published, and the service is reached over the
  # network of the deployment.
  control:
    image: ghcr.io/ggpwnkthx/gateway:1.0.0
    restart: unless-stopped
    command: ['bun', 'run', 'src/control-main.ts']
    environment:
      GATEWAY_CONTROL_HOST: 0.0.0.0
      GATEWAY_CONTROL_PORT: '9090'
      GATEWAY_CONTROL_TOKENS_FILE: /etc/platform/control-tokens.json
      GATEWAY_CONTROL_STATE_URL: redis://redis:6379/0
      GATEWAY_CONTROL_KEY_PREFIX: gateway
      GATEWAY_CONTROL_SHARED_STATE_KEY_PREFIX: gateway
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
    volumes:
      - ../../config/control-tokens.example.json:/etc/platform/control-tokens.json:ro
    expose:
      - '9090'
    depends_on:
      redis:
        condition: service_healthy

# The credentials of the deployment. They are files: the secret manager
# of the deployment writes them, and the stack mounts them where the
# services read them.
secrets:
  access-context-token:
    file: ${ACCESS_CONTEXT_TOKEN_FILE:?the file of the credential of the context contract is required}
  cursor-key:
    file: ${CURSOR_KEY_FILE:?the file of the key that signs the cursors is required}
  gateway-identity-public-key:
    file: ${GATEWAY_IDENTITY_PUBLIC_KEY:?the file of the public key of the gateway is required}

volumes:
  pg-data:
  redis-data:
