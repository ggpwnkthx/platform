# The console alone: the web application of the platform.
#
#   docker compose -f deploy/compose/console.compose.yaml up --build
#
# The console is a **client** of the platform: it authenticates the
# caller against Access, it reads the data of a workspace
# through the gateway and it acts for Access with the
# credential of the operator.
#
# This stack brings the console and nothing else: Access and
# the gateway of a deployment are its own, and the urls below point at
# them. A stack that wants the whole platform is
# `deploy/compose/platform.compose.yaml`.
#
# The console listens on http://localhost:8083.
name: platform-console

services:
  console:
    build:
      # The context is the root of the repository: the dependencies of a
      # workspace are installed by the root `bun install`.
      context: ../..
      dockerfile: packages/console/Dockerfile
    command: ['src/main.ts']
    ports:
      - '8083:8083'
    environment:
      CONSOLE_ENVIRONMENT: development
      CONSOLE_HOST: 0.0.0.0
      CONSOLE_PORT: '8083'
      CONSOLE_PUBLIC_URL: http://localhost:8083
      # Access: the console is a client of it, and it
      # authenticates the caller against it.
      CONSOLE_ACCESS_URL: ${CONSOLE_ACCESS_URL:-http://access.internal:8081}
      # The client of the console at Access: the client of
      # the tenant of the deployment.
      CONSOLE_CLIENT_ID: ${CONSOLE_CLIENT_ID:-platform}
      CONSOLE_CLIENT_SECRET: ${CONSOLE_CLIENT_SECRET:-the-client-secret-of-the-development}
      # The gateway: the console reads the data through it, with the
      # token of the caller. The url names the host of the route of the
      # Data, because the gateway matches the host of the caller
      # against its route table.
      CONSOLE_GATEWAY_URL: ${CONSOLE_GATEWAY_URL:-http://api.gateway.test:8080}
      # Data: the console reads the data through the
      # gateway, and it reads the probes of Data here. The
      # variable is optional: a stack that has no Data of its
      # own leaves it unset, and the console does not probe it.
      CONSOLE_DATA_URL: ${CONSOLE_DATA_URL-}
      # The credential of the administration of Access, and
      # the credential of the contract of the access context. A
      # deployment brings its own, from its secret manager.
      CONSOLE_ADMIN_TOKEN: ${CONSOLE_ADMIN_TOKEN:-the-admin-token-of-the-development}
      CONSOLE_TENANT_ADMIN_TOKENS: ${CONSOLE_TENANT_ADMIN_TOKENS:-}
      CONSOLE_ACCESS_CONTEXT_TOKEN: ${CONSOLE_ACCESS_CONTEXT_TOKEN:-}
      CONSOLE_ROUTE_ID: console
      CONSOLE_SESSION_SECRET: ${CONSOLE_SESSION_SECRET:-the-session-secret-of-the-development}
      CONSOLE_LOG_LEVEL: info
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:8083/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
