services:
  # PostgreSQL 18 with the token validator. No login has a password: over the network a token
  # is the only way in, and the server's own superuser is reached through its socket alone.
  postgres:
    build: ../postgres
    image: platform-postgres:local
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: postgres
      PLATFORM_OIDC_ISSUER: http://localhost:${DEX_PORT:-5556}/dex
      PLATFORM_TOKEN_ONLY_FROM: 10.89.71.0/24
    networks: [default, relay]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
      # Dex, below, listens in this container's network namespace.
      - "127.0.0.1:${DEX_PORT:-5556}:${DEX_PORT:-5556}"
    volumes:
      # Not the volume a PostgreSQL 16 stack used: that one is left as it was.
      - data18:/var/lib/postgresql
      # The server's own socket, shared with the installer and with nothing else.
      - socket:/var/run/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d platform"]
      interval: 3s
      timeout: 3s
      retries: 20
  # The one issuer PostgreSQL trusts. Upstream sign-in systems are connectors in its config.
  # An issuer has a single URL, which the browser and PostgreSQL must both be able to open. On a
  # developer's machine that is localhost, so Dex joins PostgreSQL's network namespace, where
  # localhost reaches it too. A real deployment gives Dex an HTTPS name instead.
  dex:
    image: ghcr.io/dexidp/dex:v2.46.1
    command: [dex, serve, /etc/dex/config.yaml]
    network_mode: service:postgres
    environment:
      DEX_ISSUER: http://localhost:${DEX_PORT:-5556}/dex
      DEX_HTTP_PORT: ${DEX_PORT:-5556}
      PLATFORM_PUBLIC_ORIGIN: ${PLATFORM_PUBLIC_ORIGIN:-http://localhost:5173}
      DEX_LOCAL_USERS: "1"
      DEX_ADMIN_HASH: ${DEX_ADMIN_HASH:-}
      DEX_ALICE_HASH: ${DEX_ALICE_HASH:-}
      DEX_BOB_HASH: ${DEX_BOB_HASH:-}
    volumes:
      - ../dex/config.yaml.tmpl:/etc/dex/config.yaml:ro
      - dex:/var/dex
    tmpfs: [/tmp]
    depends_on: [postgres]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  # The installer: the operator's tools, beside PostgreSQL. It is given no credentials, because
  # there are none: it shares the server's socket, where PostgreSQL lets its own superuser in.
  # It runs through `compose --profile install run`, and is never part of `up`.
  migrate:
    profiles: [install]
    build:
      context: ../..
      target: cli
    image: platform-cli:local
    command: [migrate]
    environment:
      # A directory, not a name: the socket in it is the way in.
      DATABASE_HOST: /var/run/postgresql
      DATABASE_NAME: platform
      DATABASE_SSL: disable
      PGUSER: postgres
    volumes:
      - socket:/var/run/postgresql
    # The socket is on a volume, not on a network: the installer needs none.
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  # Forwards the interface's WebSockets to PostgreSQL's port, byte for byte. It holds no
  # credentials and reads nothing it carries: the token inside the stream is PostgreSQL's to check.
  relay:
    build:
      context: ../..
      target: relay
    image: platform-relay:local
    environment:
      RELAY_UPSTREAM: postgres:5432
      RELAY_PORT: 8081
      # The only origin allowed to open a session: the address the site is served from.
      RELAY_ORIGINS: ${PLATFORM_PUBLIC_ORIGIN:-http://localhost:8080}
    networks: [relay]
    # Published for local use: a browser on this machine opens the relay directly.
    ports: ["127.0.0.1:${RELAY_PORT:-8081}:8081"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  default: {}
  # PostgreSQL and the relay. Its address range is the one PostgreSQL lets no administrator in from.
  relay:
    ipam:
      config:
        - subnet: 10.89.71.0/24
volumes:
  data18:
  socket:
  dex:
