services:
  # PostgreSQL 18 with the token validator. No login has a password: over the network a token
  # is the only way in, and the server's own superuser is reached through its socket alone.
  postgres:
    build: ../postgres
    image: platform-postgres:local
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: postgres
      # The issuer, on the deployment's own name for Dex, on the port the edge answers on.
      # It is the same address everywhere: the browser, this container and the tools.
      PLATFORM_OIDC_ISSUER: http://${PLATFORM_IDP_HOST:-idp}.${PLATFORM_DOMAIN:-localhost}:${EDGE_PORT:-8080}
      PLATFORM_TOKEN_ONLY_FROM: 10.89.71.0/24
    # The edge shares this container's network namespace, so the issuer's name is the
    # loopback here, and the edge answers for it.
    extra_hosts:
      - "${PLATFORM_IDP_HOST:-idp}.${PLATFORM_DOMAIN:-localhost}:127.0.0.1"
    networks: [default, relay]
    ports:
      # PostgreSQL, on its own name: db.<domain> answers on the default port.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
      # The edge, below: the only part of the stack that answers on the network, so the
      # only part that is published. The ports are the operator's to choose, and are
      # never 80 or 443: a rootless container cannot bind those. The port inside is the
      # port outside, so that one address is the same everywhere.
      - "127.0.0.1:${EDGE_PORT:-8080}:${EDGE_PORT:-8080}"
      - "127.0.0.1:${EDGE_TLS_PORT:-4433}:${EDGE_TLS_PORT:-4433}"
    volumes:
      # Not the volume a PostgreSQL 16 stack used: that one is left as it was.
      - data18:/var/lib/postgresql
      # The server's own socket, shared with the installer and with nothing else.
      - socket:/var/run/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d platform"]
      interval: 3s
      timeout: 3s
      retries: 20
  # The one issuer PostgreSQL trusts. Upstream sign-in systems are connectors in its config.
  # An issuer has a single URL, which the browser and PostgreSQL must both be able to open. On a
  # developer's machine that is localhost, so Dex joins PostgreSQL's network namespace, where
  # localhost reaches it too. A real deployment gives Dex an HTTPS name instead.
  dex:
    # By digest as well as by tag: a tag can be moved to other content, a digest cannot.
    image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
    command: [dex, serve, /etc/dex/config.yaml]
    network_mode: service:postgres
    environment:
      # The issuer, on the deployment's own name for Dex, on the port the edge answers on.
      # It is the same address the browser and PostgreSQL use: the tokens carry it, and
      # PostgreSQL compares it with what it was told.
      DEX_ISSUER: http://${PLATFORM_IDP_HOST:-idp}.${PLATFORM_DOMAIN:-localhost}:${EDGE_PORT:-8080}
      DEX_HTTP_PORT: ${DEX_PORT:-5556}
      PLATFORM_PUBLIC_ORIGIN: ${PLATFORM_PUBLIC_ORIGIN:-http://localhost:5173}
      # The one account with a password: the break-glass administrator. It is a second,
      # weaker sign-in system, so it belongs to a development stack: a deployment on a name
      # of its own must say DEX_LOCAL_ADMIN=1 to have one at all. Everybody else
      # signs in through a connector, an identity provider that vouches for its addresses.
      DEX_LOCAL_ADMIN: "${DEX_LOCAL_ADMIN:-}"
      # Who that is: the deployment's own administrator, on its own domain.
      DEX_ADMIN_EMAIL: ${PLATFORM_ADMIN:-admin@localhost}
      DEX_ADMIN_HASH: ${DEX_ADMIN_HASH:-}
    volumes:
      - ../dex/config.yaml.tmpl:/etc/dex/config.yaml:ro
      # The sign-in form, with the administrator's address filled in: Dex's own, with that
      # one change, over the image's.
      - ../dex/password.html:/srv/dex/web/templates/password.html:ro
      - dex:/var/dex
    # No extra hosts here: a container that joins another's network namespace may not
    # carry them. Dex does not need the name: the browser and PostgreSQL open the issuer.
    tmpfs: [/tmp]
    depends_on: [postgres]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  # The installer: the operator's tools, beside PostgreSQL. It is given no credentials, because
  # there are none: it shares the server's socket, where PostgreSQL lets its own superuser in.
  # It runs through `compose --profile install run`, and is never part of `up`.
  migrate:
    profiles: [install]
    build:
      context: ../..
      target: cli
    image: platform-cli:local
    command: [migrate]
    environment:
      # A directory, not a name: the socket in it is the way in.
      DATABASE_HOST: /var/run/postgresql
      DATABASE_NAME: platform
      DATABASE_SSL: disable
      PGUSER: postgres
      # The administrator the site's roles are made for: the account Dex keeps.
      PLATFORM_ADMIN: ${PLATFORM_ADMIN:-}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-localhost}
    volumes:
      - socket:/var/run/postgresql
      # The folder of the site the deployment chose, read and never written: `apply
      # --dir=/app/site` reads its platform.json and the files it says it applies. It is
      # any folder on this machine; the image carries the tools alone. A deployment that
      # chose no site reads nothing here.
      - ${PLATFORM_SITE_FOLDER:-../../examples}:/app/site:ro
    # The socket is on a volume, not on a network: the installer needs none.
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  # The site, when the deployment chose a folder to deploy one from: its built files, served
  # as a CDN would serve them, with the headers the build wrote beside them. It is started
  # only then; a site that already exists is published to a CDN and is not a container.
  # The image is the installer's: the operator's tools carry the server.
  site:
    image: platform-cli:local
    command: [ui, serve, --dir=/site, --port=8080]
    volumes:
      # The files `ui build` wrote on this machine, read and never written.
      - ${PLATFORM_SITE_DIST:-../../packages/ui/dist}:/site:ro
    # Not published: the edge, below, is how the site is reached, by its own name.
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  # The edge: the only part of the stack that answers on the network's usual ports. It
  # shares PostgreSQL's network namespace, where Dex lives too, so that the issuer's name
  # is the loopback there and PostgreSQL fetches the issuer's keys through the edge.
  edge:
    image: docker.io/library/traefik:v3.5@sha256:16acb89c6db341182970d6fdafece31303b0a380a8ed7aa51682e225229bf1d2
    network_mode: service:postgres
    command:
      # The same port inside and out, so that one address is the same everywhere.
      - --entryPoints.web.address=:${EDGE_PORT:-8080}
      # The port TLS is answered on, for an operator who gives the edge a certificate.
      - --entryPoints.websecure.address=:${EDGE_TLS_PORT:-4433}
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --accessLog=false
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-localhost}
      PLATFORM_IDP_HOST: ${PLATFORM_IDP_HOST:-idp}
      PLATFORM_API_HOST: ${PLATFORM_API_HOST:-api}
      # The site the deployment chose, if it chose one, and the name it answers on.
      PLATFORM_SITE: ${PLATFORM_SITE:-}
      PLATFORM_APP_HOST: ${PLATFORM_APP_HOST:-app}
      DEX_PORT: ${DEX_PORT:-5556}
      RELAY_PORT: ${RELAY_PORT:-8081}
    volumes:
      - ../traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    # Not the relay: the edge is started before it, with Dex, and answers for the relay
    # once the relay is there.
    depends_on: [postgres]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  # Forwards the interface's WebSockets to PostgreSQL's port, byte for byte. It holds no
  # credentials and reads nothing it carries: the token inside the stream is PostgreSQL's to check.
  relay:
    build:
      context: ../..
      target: relay
    image: platform-relay:local
    environment:
      RELAY_UPSTREAM: postgres:5432
      # In the clear, and said so: the relay and PostgreSQL share a network of this machine's
      # own, which nothing else is on.
      RELAY_UPSTREAM_TLS: "off"
      RELAY_PORT: ${RELAY_PORT:-8081}
      # The only origin allowed to open a session: the address the site is served from.
      RELAY_ORIGINS: ${PLATFORM_PUBLIC_ORIGIN:-http://localhost:8080}
    networks: [relay]
    # Not published: the edge, above, is how the relay is reached, by its own name.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  default: {}
  # PostgreSQL and the relay. Its address range is the one PostgreSQL lets no administrator in from.
  relay:
    ipam:
      config:
        - subnet: 10.89.71.0/24
volumes:
  data18:
  socket:
  dex:
