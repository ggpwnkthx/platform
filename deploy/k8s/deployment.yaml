# The relay: the WebSocket in front of PostgreSQL's port. The interface itself is a static
# site on a CDN and is not deployed here; only the relay and the database it forwards to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-relay
  labels: { app: platform }
spec:
  replicas: 2
  selector:
    matchLabels: { app: platform }
  template:
    metadata:
      labels: { app: platform }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        # Forwards each WebSocket to PostgreSQL's port, byte for byte. No credentials, no SQL:
        # the reader's token travels inside the stream and PostgreSQL checks it.
        - name: relay
          image: YOUR_REGISTRY/platform-relay:2.3.0
          ports: [{ containerPort: 8081 }]
          env:
            - { name: RELAY_UPSTREAM, value: "db.YOUR_DOMAIN:5432" }
            - { name: RELAY_PORT, value: "8081" }
            # The only origin allowed to open a session: the address of the site on the CDN.
            - { name: RELAY_ORIGINS, value: "https://platform.example.com" }
            # Behind an ingress every reader arrives from the ingress controller's address.
            # Name its addresses here and the relay counts logins against the client it
            # reports in X-Forwarded-For; from any other address the header is ignored.
            # - { name: RELAY_TRUSTED_PROXIES, value: "10.0.0.0/8" }
            # Reach PostgreSQL in TLS, and check its certificate, where the network between
            # the pods and the database is not one you would trust with a token.
            # - { name: RELAY_UPSTREAM_TLS, value: "verify" }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            httpGet: { path: /health, port: 8081 }
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
---
# The Service in front of the relay. The address the pages open their sessions through is
# yours to choose: put this service behind an ingress, a load balancer or a tunnel that
# serves TLS. deploy/k8s/ingress.yaml is an example of one, and it names the host and the
# certificate to use.
apiVersion: v1
kind: Service
metadata:
  name: platform-relay
  labels: { app: platform }
spec:
  selector: { app: platform }
  ports:
    - { name: relay, port: 8081, targetPort: 8081 }
