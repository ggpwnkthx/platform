# The relay: the WebSocket in front of PostgreSQL's port. The interface itself is a static
# site on a CDN and is not deployed here; only the relay and the database it forwards to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-relay
  labels: { app: platform }
spec:
  replicas: 2
  selector:
    matchLabels: { app: platform }
  template:
    metadata:
      labels: { app: platform }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        # Forwards each WebSocket to PostgreSQL's port, byte for byte. No credentials, no SQL:
        # the reader's token travels inside the stream and PostgreSQL checks it.
        - name: relay
          image: YOUR_REGISTRY/platform-relay:2.3.0
          ports: [{ containerPort: 8081 }]
          env:
            - { name: RELAY_UPSTREAM, value: "db.YOUR_DOMAIN:5432" }
            - { name: RELAY_PORT, value: "8081" }
            # The only origin allowed to open a session: the address of the site on the CDN.
            - { name: RELAY_ORIGINS, value: "https://platform.example.com" }
            # The relay forwards and counts nothing. How many sessions one address may hold is
            # the ingress's to cap (see ingress.yaml), how many one role may hold is
            # PostgreSQL's (ALTER ROLE ... CONNECTION LIMIT, or `connections` in a manifest),
            # and a login that stalls is closed by PostgreSQL's authentication_timeout.
            # Reach PostgreSQL in TLS, and check its certificate: the stream carries every
            # reader's token. PostgreSQL needs ssl=on and a certificate for the name above
            # (name its authority in RELAY_UPSTREAM_CA when it is not one the system knows).
            # "off" is for a network between the pods and the database that you would trust
            # with a token, such as a service mesh with mTLS; the relay does not start
            # without one or the other.
            - { name: RELAY_UPSTREAM_TLS, value: "verify" }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          livenessProbe:
            httpGet: { path: /health, port: 8081 }
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
---
# The Service in front of the relay. The address the pages open their sessions through is
# yours to choose: put this service behind an ingress, a load balancer or a tunnel that
# serves TLS. deploy/k8s/ingress.yaml is an example of one, and it names the host and the
# certificate to use.
apiVersion: v1
kind: Service
metadata:
  name: platform-relay
  labels: { app: platform }
spec:
  selector: { app: platform }
  ports:
    - { name: relay, port: 8081, targetPort: 8081 }
