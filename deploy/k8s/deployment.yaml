apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  labels: { app: platform }
spec:
  replicas: 2
  selector:
    matchLabels: { app: platform }
  template:
    metadata:
      labels: { app: platform }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        # The interface: static pages served by nginx, with /pg forwarded to the relay beside it.
        - name: ui
          image: YOUR_REGISTRY/platform-ui:2.1.0
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PUBLIC_URL, value: "https://platform.example.com" }
            - { name: OIDC_ISSUER, value: "https://sso.example.com/dex" }
            - { name: DATABASE_NAME, value: platform }
            - { name: RELAY_UPSTREAM, value: "127.0.0.1:8081" }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
        # Forwards each WebSocket to PostgreSQL's port, byte for byte. No credentials, no SQL:
        # the reader's token travels inside the stream and PostgreSQL checks it.
        - name: relay
          image: ghcr.io/vi/websocat:v1.14.2
          args:
            - --binary
            - --exit-on-eof
            - --conncap
            - "256"
            - ws-l:127.0.0.1:8081
            - "tcp:postgres.example.com:5432"
          resources:
            requests: { cpu: 50m, memory: 16Mi }
            limits: { cpu: 500m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 8Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: platform
  labels: { app: platform }
spec:
  selector: { app: platform }
  ports: [{ port: 80, targetPort: 8080 }]
