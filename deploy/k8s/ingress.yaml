# An example Ingress for the relay: the address the pages open their sessions through.
#
# The interface is a static site on a CDN; the relay is the only thing of ours that answers
# on the network. Put it behind whatever serves TLS in your cluster: this ingress, a cloud
# load balancer or a tunnel. `platform deploy k8s apply` does not apply this file: it is a
# starting point, and it names the host and the certificate to use.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-relay
  labels: { app: platform }
  annotations:
    # A database session may stay open for a long while.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Open sessions one client address may hold through the relay at once.
    nginx.ingress.kubernetes.io/limit-connections: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.YOUR_DOMAIN]
      secretName: platform-relay-tls
  rules:
    - host: api.YOUR_DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-relay
                port: { name: relay }
