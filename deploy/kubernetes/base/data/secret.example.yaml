# The template of the secret of the data service.
#
# The real secret does NOT live in the repository and it does not live in
# this file: it is created in the secret store of the platform and applied
# with the sealed secrets, the external secrets operator or the equivalent
# of the platform.
#
#   kubectl create secret generic platform-data-secrets \
#     --from-literal=DATA_DATABASE_URL='postgres://data_runtime:...@postgres.platform.svc.cluster.local:5432/data' \
#     --from-literal=DATA_REGISTRY_DATABASE_URL='postgres://data_registry:...@postgres.platform.svc.cluster.local:5432/data' \
#     --from-literal=DATA_ADMIN_DATABASE_URL='postgres://platform:...@postgres.platform.svc.cluster.local:5432/postgres' \
#     --from-literal=DATA_OWNER_DATABASE_URL='postgres://platform:...@postgres.platform.svc.cluster.local:5432/data' \
#     --from-literal=DATA_OWNER_PASSWORD=... \
#     --from-literal=DATA_RUNTIME_PASSWORD=... \
#     --from-literal=DATA_REGISTRY_PASSWORD=... \
#     --from-literal=DATA_DELIVERY_PASSWORD=... \
#     --from-literal=DATA_MAINTENANCE_PASSWORD=... \
#     --from-file=access-context.token=... \
#     --from-file=cursor.key=... \
#     --from-file=identity-signing.public.pem=...
#
# The names of the keys are the names of the variables of the service and
# the names of the files it reads: the deployment reads them from the
# environment, and the three files are mounted at the paths of the
# environment of the service.
apiVersion: v1
kind: Secret
metadata:
  name: platform-data-secrets
  labels:
    app.kubernetes.io/name: platform-data
    app.kubernetes.io/component: data
type: Opaque
stringData:
  # The scoped role of the api and the narrow reader of the registry.
  DATA_DATABASE_URL: "postgres://data_runtime:replace-me@postgres.platform.svc.cluster.local:5432/data"
  DATA_REGISTRY_DATABASE_URL: "postgres://data_registry:replace-me@postgres.platform.svc.cluster.local:5432/data"
  # The administrator of the server and the owner of the schema: they are
  # the credentials of the migration, and the api never uses them.
  DATA_ADMIN_DATABASE_URL: "postgres://platform:replace-me@postgres.platform.svc.cluster.local:5432/postgres"
  DATA_OWNER_DATABASE_URL: "postgres://platform:replace-me@postgres.platform.svc.cluster.local:5432/data"
  # The passwords of the roles of the deployment.
  DATA_OWNER_PASSWORD: "replace-me-with-a-password"
  DATA_RUNTIME_PASSWORD: "replace-me-with-a-password"
  DATA_REGISTRY_PASSWORD: "replace-me-with-a-password"
  DATA_DELIVERY_PASSWORD: "replace-me-with-a-password"
  DATA_MAINTENANCE_PASSWORD: "replace-me-with-a-password"
  # The credential of the access context contract: the data service
  # presents it to the access service and it asks about a scope.
  access-context.token: "replace-me-with-a-credential"
  # The key that signs the cursors of the pages: at least 32 bytes.
  cursor.key: "replace-me-with-at-least-32-bytes"
  # The **public** key of the gateway of the deployment: the data service
  # verifies the identity of the requests with it, and it cannot mint one.
  identity-signing.public.pem: |
    -----BEGIN PUBLIC KEY-----
    replace-me-with-the-public-key-of-the-gateway
    -----END PUBLIC KEY-----
