apiVersion: v1
kind: Service
metadata:
  name: platform-access
  labels:
    app.kubernetes.io/name: platform-access
    app.kubernetes.io/component: access
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-access
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The autoscaling of the service.
#
# The signal is the CPU: the service does not export a gauge of the
# requests that are in flight, and the decisions it takes are cheap
# enough for the processor to carry them.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform-access
  labels:
    app.kubernetes.io/name: platform-access
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: platform-access
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # A pod that is removed takes the state of a login with it: the
      # window is long enough for the requests that are in flight.
      stabilizationWindowSeconds: 300
---
# The pods of a deployment are spread over the nodes: a node that fails
# does not take the service with it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-access
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-access
---
# The service is reached by the gateway and by the data service of the
# platform, and by nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-access
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-access
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform
      ports:
        - protocol: TCP
          port: 8081
