apiVersion: v1
kind: Service
metadata:
  name: platform-access
  labels:
    app.kubernetes.io/name: platform-access
    app.kubernetes.io/component: access
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-access
    app.kubernetes.io/component: access
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The autoscaling of the service.
#
# The signal is the CPU: the service does not export a gauge of the
# requests that are in flight, and the decisions it takes are cheap
# enough for the processor to carry them.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform-access
  labels:
    app.kubernetes.io/name: platform-access
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: platform-access
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # A pod that is removed takes the state of a login with it: the
      # window is long enough for the requests that are in flight.
      stabilizationWindowSeconds: 300
---
# The pods of a deployment are spread over the nodes: a node that fails
# does not take the service with it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-access
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-access
      app.kubernetes.io/component: access
---
# The service is reached by the gateway and by Data of the
# platform, and by nothing else.
#
# The browsers of the deployment reach the issuer through the ingress, and
# the console of the platform reaches the service of the decisions.
#
# The egress is part of the policy: Access holds the policy of the
# deployment, and it reaches the database of that policy, the state of the
# logins and the provider of the identity of the tenants.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-access
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-access
      app.kubernetes.io/component: access
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # The browsers of the deployment reach the issuer through the ingress.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - protocol: TCP
          port: 8081
    # The gateway asks Access about the workspaces, and Data asks it about
    # the scope of a record.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: platform-gateway
              app.kubernetes.io/component: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: platform-data
              app.kubernetes.io/component: data
      ports:
        - protocol: TCP
          port: 8081
    # The console of the platform reaches the service of the decisions.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: platform-console
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # The database of the policy and the state of the logins. The server
    # is outside of the namespace of the platform, so the policy names the
    # port and not the address.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    # The names of the cluster.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The provider of the identity of the tenants: Access is a broker, and
    # a broker reaches the provider of the tenant.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
