# The template of the secret of the access service.
#
# The real secret does NOT live in the repository and it does not live in
# this file: it is created in the secret store of the platform and applied
# with the sealed secrets, the external secrets operator or the equivalent
# of the platform.
#
#   kubectl create secret generic platform-access-secrets \
#     --from-literal=ACCESS_DATABASE_URL=postgres://access_app:...@postgres.platform.svc.cluster.local:5432/platform \
#     --from-literal=ACCESS_REDIS_URL=rediss://:...@redis.platform.svc.cluster.local:6379/0 \
#     --from-literal=ACCESS_ADMIN_TOKEN="$(openssl rand -hex 24)" \
#     --from-literal=ACCESS_DECISION_TOKEN="$(openssl rand -hex 24)" \
#     --from-literal=ACCESS_CONTEXT_TOKENS='{"the-context-token-of-the-deployment":null}' \
#     --from-literal=ACCESS_STATE_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=ACCESS_SECRET_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
#     --from-literal=ACCESS_SIGNING_KEY="$(openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256)" \
#     --from-literal=ACCESS_SIGNING_KID=access-1
#
# The names of the keys are the names of the variables of the service: the
# deployment reads them from the environment.
apiVersion: v1
kind: Secret
metadata:
  name: platform-access-secrets
  labels:
    app.kubernetes.io/name: platform-access
    app.kubernetes.io/component: access
type: Opaque
stringData:
  # The database of the five tables and the shared state of the
  # authorization codes.
  ACCESS_DATABASE_URL: "postgres://access_app:replace-me@postgres.platform.svc.cluster.local:5432/platform"
  ACCESS_REDIS_URL: "rediss://:replace-me@redis.platform.svc.cluster.local:6379/0"
  # The bearer token of the nine administrative endpoints and the one the
  # gateway presents on `POST /v1/decisions`.
  ACCESS_ADMIN_TOKEN: "replace-me"
  ACCESS_DECISION_TOKEN: "replace-me"
  # The credentials of the access context contract: the key is the bearer
  # token of a deployment and the value holds the tenants it may ask about.
  # A `null` scope means every tenant.
  ACCESS_CONTEXT_TOKENS: '{"the-context-token-of-the-deployment":null}'
  # The secret that signs and encrypts the state of a login, and the key
  # that encrypts the client secrets of the tenants at rest. They have to
  # be the same on every replica.
  ACCESS_STATE_SECRET: "replace-me-with-32-random-bytes"
  ACCESS_SECRET_ENCRYPTION_KEY: "replace-me-with-32-random-bytes"
  # The private key the service signs its tokens with, and the identifier
  # of it in the JWKS.
  #
  #   openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256
  ACCESS_SIGNING_KEY: "replace-me-with-a-private-key"
  ACCESS_SIGNING_KID: "access-1"
