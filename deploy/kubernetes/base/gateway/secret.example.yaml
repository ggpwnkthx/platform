# The template of the secret of the deployment.
#
# The real secret does NOT live in the repository and it does not live in
# this file: it is created in the secret store of the platform and applied
# with the sealed secrets, the external secrets operator or the equivalent
# of the platform.
#
#   kubectl create secret generic platform-gateway-secrets \
#     --from-literal=GATEWAY_SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=GATEWAY_IDENTITY_SIGNING_KEY="$(openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256)" \
#     --from-literal=GATEWAY_OIDC_CLIENT_SECRET=... \
#     --from-literal=GATEWAY_ACCESS_TOKEN=... \
#     --from-literal=GATEWAY_METRICS_TOKEN=...
#
# The names of the keys are the names of the variables of the gateway: the
# deployment reads them from the environment.
apiVersion: v1
kind: Secret
metadata:
  name: platform-gateway-secrets
  labels:
    app.kubernetes.io/name: platform-gateway
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  # The secret that signs the state of the login. It has to be the same on
  # every replica.
  GATEWAY_SESSION_SECRET: "replace-me-with-32-random-bytes"
  # The private key that signs the identity of the requests. The upstreams
  # are given the public key of it, so an upstream that verifies an
  # identity cannot mint one. It has to be the same on every replica.
  #
  #   openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256
  GATEWAY_IDENTITY_SIGNING_KEY: "replace-me-with-a-private-key"
  GATEWAY_OIDC_CLIENT_SECRET: "replace-me"
  GATEWAY_ACCESS_TOKEN: "replace-me"
  GATEWAY_METRICS_TOKEN: "replace-me"
  # The url of the shared state. The password belongs in the secret store.
  #
  # The shared state may live in a Postgres server instead of a Redis
  # server: the two hold the same state with the same contract, and the
  # gateway measures them side by side.
  #
  #   GATEWAY_SESSION_URL: "postgres://gateway:replace-me@postgres.platform.svc.cluster.local:5432/gateway"
  #   GATEWAY_SHARED_STATE_URL: "postgres://gateway:replace-me@postgres.platform.svc.cluster.local:5432/gateway"
  GATEWAY_SESSION_URL: "rediss://:replace-me@redis.platform.svc.cluster.local:6379/0"
  GATEWAY_SHARED_STATE_URL: "rediss://:replace-me@redis.platform.svc.cluster.local:6379/1"
  # The url of the shared state of the control plane: it may write the
  # route table and the trail of the writes, and the gateway may not.
  GATEWAY_CONTROL_STATE_URL: "rediss://:replace-me@redis.platform.svc.cluster.local:6379/0"
