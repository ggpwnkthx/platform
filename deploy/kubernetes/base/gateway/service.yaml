apiVersion: v1
kind: Service
metadata:
  name: platform-gateway
  labels:
    app.kubernetes.io/name: platform-gateway
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-gateway
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The autoscaling of the gateway.
#
# The metric is the number of the requests that are in flight: it is the
# signal that follows the traffic, and it is the one the gateway already
# exports. The CPU is the second signal, for the case where the traffic of
# the gateway is not the traffic of the upstreams.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: platform-gateway
  labels:
    app.kubernetes.io/name: platform-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: platform-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: gateway_active_requests
        target:
          type: AverageValue
          averageValue: "50"
  behavior:
    scaleDown:
      # The gateway holds the sessions and the connections: a pod that is
      # removed takes its websockets with it.
      stabilizationWindowSeconds: 300
---
# The pods of a deployment are spread over the nodes: a node that fails
# does not take the gateway with it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: platform-gateway
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-gateway
      app.kubernetes.io/component: gateway
---
# The gateway accepts the traffic of the ingress and reaches Access, Data
# and the state the replicas share. The egress is part of the policy: the
# gateway is the edge of the deployment, and a pod of the namespace that
# reaches the gateway does not reach anything behind it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-gateway
      app.kubernetes.io/component: gateway
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Access decides which caller may use a workspace.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: platform-access
      ports:
        - protocol: TCP
          port: 8081
    # Data is the api of the data of the workspace.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: platform-data
      ports:
        - protocol: TCP
          port: 8082
    # The state the replicas share: the sessions, the limits and the
    # cached decisions. The server is outside of the namespace of the
    # platform, so the policy names the port and not the address.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 5432
    # The names of the cluster.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The identity provider of the callers.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
