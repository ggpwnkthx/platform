# The static site's web server. It hands out the generated pages and forwards /pg, a WebSocket,
# to the relay in front of PostgreSQL. It holds no credentials and runs no code of ours: the
# pages are files, and the bytes on /pg are the PostgreSQL protocol, which only PostgreSQL reads.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # One database session per open WebSocket: cap how many a single address may hold.
  limit_conn_zone $binary_remote_addr zone=sessions:10m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Written by /docker-entrypoint.d/30-platform.sh from the environment.
  include /tmp/platform/site.conf;
}
